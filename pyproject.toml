[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "usgs-nwis-screening"
version = "0.1.0"
description = "Reproducible screening of paired USGS streamflow and specific-conductance records"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "matplotlib>=3.10,<4",
  "numpy>=2.2,<3",
  "pandas>=2.2,<4",
  "pyarrow>=19,<24",
  "pyyaml>=6.0,<7",
  "scipy>=1.15,<2",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.11,<1",
]
forcing = [
  "xarray>=2025.1",
  "s3fs>=2025.1",
  "zarr>=3.0",
  "dask>=2024.1",
]

[project.scripts]
usgs-nwis = "usgs_nwis.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/usgs_nwis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/usgs_nwis/cli.py" = ["B008"]
